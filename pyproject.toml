[project]
authors = [{ name = "Christy Lin", email = "christy.lin@apexignite.org" }]
dependencies = []
description = "Machine learning project to optimize DNA, mRNA and amino acid sequences using Codon language models"
name = "Sequence-Optimization-with-CodonBERT"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-64"]

[tool.pixi.system-requirements]
cuda = "12.0"

[tool.pixi.pypi-dependencies]
sequence_optimization_with_codonbert = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.13.0,<3.15"
boto3 = ">=1.40.51,<2"
biopython = ">=1.85,<2"
ipykernel = ">=7.0.1,<8"
pytorch = ">=2.8.0,<3"
ipywidgets = ">=8.1.7,<9"
pandas = ">=2.3.3,<3"
psycopg2 = ">=2.9.10,<3"
scikit-learn = ">=1.7.2,<2"
transformers = ">=4.57.1,<5"
matplotlib = ">=3.10.7,<4"
