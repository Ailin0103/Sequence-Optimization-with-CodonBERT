[project]
authors = [{ name = "Christy Lin", email = "christy.lin@apexignite.org" }]
dependencies = ["multimolecule==0.2.0"]
description = "Machine learning project to optimize DNA, mRNA and amino acid sequences using Codon language models"
name = "Sequence-Optimization-with-CodonBERT"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]

channels = ["conda-forge"]

platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
#sequence_optimization_with_codonbert = { path = ".", editable = true }
transformers = "==5.3.0"
datasets = ">=4,<5"
huggingface-hub = ">=1.3,<2"
[tool.pixi.activation.env]
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.cache/matplotlib"
JUPYTER_CONFIG_DIR = "$PIXI_PROJECT_ROOT/.cache/jupyter/config"
JUPYTER_DATA_DIR = "$PIXI_PROJECT_ROOT/.cache/jupyter/data"
JUPYTER_RUNTIME_DIR = "$PIXI_PROJECT_ROOT/.cache/jupyter/runtime"
IPYTHONDIR = "$PIXI_PROJECT_ROOT/.cache/ipython"

[tool.pixi.tasks]
check-env = "python -c \"import importlib.metadata, numpy, pandas, scipy, sklearn, torch, transformers; from multimolecule import AutoModel, AutoTokenizer; print('Environment OK'); print('PyTorch:', torch.__version__); print('Transformers:', transformers.__version__); print('MultiMolecule:', importlib.metadata.version('multimolecule')); print('MPS available:', torch.backends.mps.is_available())\""
kmer = "python src/Kmer.py"
rnabert = "python src/RNABert_test.py"
jupyter = "jupyter lab"

[tool.pixi.dependencies]

python = "3.11.*"

numpy = ">=1.26,<2.0"

pandas = ">=2.2,<3.0"

scipy = ">=1.11,<1.14"

scikit-learn = ">=1.4,<1.6"

matplotlib = ">=3.8,<4"

tqdm = ">=4.66,<5"

openpyxl = ">=3.1,<4"

pyarrow = ">=15,<18"

biopython = ">=1.83,<2"

pytorch = ">=2.3,<3"

torchvision = ">=0.18,<1"

torchaudio = ">=2.3,<3"

ipykernel = ">=6.29,<8"

jupyterlab = ">=4.2,<5"

ipywidgets = ">=8.1,<9"

boto3 = ">=1.34,<2"

psycopg2 = ">=2.9,<3"

pip = ">=24,<26"
torchmetrics = ">=1.9.0,<2"
torchdata = ">=0.11.0,<0.12"
